name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Start a real server and check the dimensions load
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          ./gradlew runSelfTest 2>&1 | tee selftest.log
          grep -q "PD-SELFTEST-OK" selftest.log

      - name: Run game tests (start a real server and play a dungeon)
        run: ./gradlew runGameTestServer --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: party-dungeon-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish the latest jar to the Releases page
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar --prerelease --target "$GITHUB_SHA" \
            --title "最新版（自動ビルド）" \
            --notes "main ブランチの最新の自動ビルドです。テスト（実サーバーでの起動・通しプレイ）に合格したものだけがここに置かれます。"
